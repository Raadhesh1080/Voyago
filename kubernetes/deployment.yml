apiVersion: v1
kind: Namespace
metadata:
  name: voyago-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voyago-config
  namespace: voyago-system
data:
  POSTGRES_DB: voyago_db
  NEO4J_USER: neo4j
---
apiVersion: v1
kind: Secret
metadata:
  name: voyago-secrets
  namespace: voyago-system
type: Opaque
stringData:
  POSTGRES_USER: voyago_admin
  POSTGRES_PASSWORD: change_me_in_production
  NEO4J_PASSWORD: change_me_in_production
  JWT_SECRET: your_jwt_secret_key_change_in_production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: voyago-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: voyago-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: voyago-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: voyago-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: voyago-system
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: voyago-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: voyago-auth-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: voyago-secrets
              key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: voyago-system
spec:
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: voyago-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: voyago-api-gateway:latest
        ports:
        - containerPort: 3000
        env:
        - name: AUTH_SERVICE_URL
          value: http://auth-service:3001
        - name: USER_SERVICE_URL
          value: http://user-service:3002
        - name: TRIP_SERVICE_URL
          value: http://trip-service:3003
        - name: PAYMENT_SERVICE_URL
          value: http://payment-service:3004
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: voyago-system
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
